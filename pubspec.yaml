publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  retrofit: ^4.1.0
  json_annotation: ^4.12.0
  provider: ^6.1.2
